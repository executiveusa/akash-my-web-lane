name: ICM walk

on:
  push:
  pull_request:

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cold-agent walk test
        run: node scripts/quality/icm-walk.mjs
