name: Sovereign Container

on:
  push:
  pull_request:

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000 \
            --build-arg NEXT_PUBLIC_WEB_URL=http://127.0.0.1:3001 \
            --build-arg NEXT_PUBLIC_MARKET=us \
            -t myweblane-ci .

      - name: Smoke container
        run: |
          docker run -d --name myweblane-ci -p 3001:3001 myweblane-ci
          trap 'docker rm -f myweblane-ci' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3001/api/health
